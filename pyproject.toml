[project]
name = "testforge-backend"
version = "1.4.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.5",
    "playwright>=1.48",
    "openai>=1.50",
    "httpx>=0.27",
    "python-multipart>=0.0.33",
]
[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]
[tool.pytest.ini_options]
testpaths = ["tests"]
